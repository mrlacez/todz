<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Booking - Elite Auto Paintworks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer-phase2.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo">Elite Auto Paintworks</div>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <nav id="navLinks">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('services') }}">Services</a>
            <a href="{{ url_for('gallery') }}">Gallery</a>
            <a href="{{ url_for('booking') }}">Book</a>
            <a href="{{ url_for('booking_check') }}" class="active">Check Booking</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
    </header>

    <section class="page-banner">
        <h1>Check Booking Status</h1>
        <p>Enter your phone number to view your bookings.</p>
    </section>

    <section class="section">
        <div class="check-booking-wrap">
            <div class="card check-form-card">
                <input type="text" id="checkPhone" placeholder="Enter phone number">
                <button id="checkBookingBtn">Check Booking</button>
                <p id="checkStatus"></p>
            </div>

            <div id="bookingResults" class="card-grid"></div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 Elite Auto Paintworks. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/booking-check.js') }}"></script>
</body>
</html>
